name: CI Typecheck

on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - "*"
      - "*/*"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Setup Yarn
        run: npm install -g yarn
        shell: bash

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        shell: bash

      - name: Run typecheck
        run: yarn typecheck
        shell: bash
